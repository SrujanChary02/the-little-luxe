<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- The Ruvi Collection — logo source. Rendered to PNG/PDF by brand/src/render.sh.
     Use ?v=primary|horizontal|monogram|square|og &c=ink|light &bg=ivory|blush &tag=1 -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400&display=block" rel="stylesheet" />
<style>
  :root { --ink:#2b2420; --gold:#b8925a; --gold-light:#d4b483; --ivory:#fbf7f2; --blush:#f3e6df; }
  @page { size: 1000px 560px; margin: 0; }
  html, body { margin: 0; background: transparent; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  .c-ink   { --fg: var(--ink);   --accent: var(--gold); }
  .c-light { --fg: var(--ivory); --accent: var(--gold-light); }
  .serif { font-family: "Cormorant Garamond", serif; }
  .sans  { font-family: Jost, sans-serif; font-weight: 300; text-transform: uppercase; }

  /* The ruby: a nod to "Ruvi" */
  .gem .stone { fill: url(#ruby); }
  .gem .facets { fill: none; stroke: var(--accent); stroke-linejoin: round; }

  /* Primary stacked logo */
  .primary { display: flex; flex-direction: column; align-items: center; color: var(--fg); }
  .primary .gem { width: 62px; margin-bottom: 18px; }
  .the { display: flex; align-items: center; gap: 20px; font-style: italic; font-weight: 500; font-size: 52px; line-height: 1; color: var(--accent); }
  .rule { width: 78px; height: 1.5px; background: var(--accent); }
  .ruvi { font-weight: 500; font-size: 160px; line-height: .92; letter-spacing: .2em; margin-right: -.2em; margin-top: 6px; }
  .collection { font-size: 27px; line-height: 1; margin-top: 20px; white-space: nowrap; }
  .tag { font-style: italic; font-size: 30px; color: var(--accent); margin-top: 26px; }

  /* Horizontal logo (also used in the website header): gem | The RUVI / COLLECTION */
  .horizontal { display: flex; align-items: center; gap: 24px; color: var(--fg); }
  .horizontal .gem { width: 66px; }
  .horizontal .words { display: flex; flex-direction: column; align-items: flex-start; }
  .horizontal .line { display: flex; align-items: baseline; gap: 16px; }
  .horizontal .the { font-size: 58px; }
  .horizontal .ruvi { font-size: 84px; line-height: 1; letter-spacing: .2em; margin: 0 -.2em 0 0; }
  .horizontal .collection { font-size: 18.5px; margin-top: 8px; }

  /* Monogram: a ring set with a ruby, holding an italic R */
  .monogram { width: 86vmin; height: 86vmin; }
  .monogram text { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; font-size: 46px; fill: var(--fg); }
  .square { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .square.ivory { background: var(--ivory); }
  .square.blush { background: var(--blush); }
  .square.ink { background: radial-gradient(circle at 50% 42%, #40342d 0%, var(--ink) 72%); }
  .square .monogram { width: 78vmin; height: 78vmin; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const q = new URLSearchParams(location.search);
  const v = q.get("v") || "primary", c = q.get("c") || "ink", bg = q.get("bg") || "";
  const ruby = (id) => `<linearGradient id="${id}" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f1b9bd"/><stop offset=".38" stop-color="#c25a63"/><stop offset=".72" stop-color="#97303b"/><stop offset="1" stop-color="#6e1f29"/></linearGradient>`;
  const GEM = "M22 4 H58 L76 20 L40 60 L4 20 Z";
  const gem = `<svg class="gem" viewBox="0 0 80 64"><defs>${ruby("ruby")}</defs>
    <path class="stone" d="${GEM}"/>
    <path class="facets" stroke-width="2.6" d="${GEM} M4 20 H76 M22 4 L30 20 L40 60 M58 4 L50 20 L40 60 M30 20 L40 4 L50 20"/></svg>`;
  const ring = `<svg class="monogram" viewBox="0 0 100 100">
    <defs>${ruby("ruby-m")}<mask id="m"><rect width="100" height="100" fill="white"/>
      <path d="M43 9 H57 L63 17 L50 31 L37 17 Z" fill="black" stroke="black" stroke-width="7" stroke-linejoin="round"/></mask></defs>
    <circle cx="50" cy="60" r="31" fill="none" stroke="var(--accent)" stroke-width="2.4" mask="url(#m)"/>
    <path d="M43 9 H57 L63 17 L50 31 L37 17 Z" fill="url(#ruby-m)"/>
    <path d="M43 9 H57 L63 17 L50 31 L37 17 Z M37 17 H63 M47 17 L50 9 L53 17 M47 17 L50 31 M53 17 L50 31" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="49.5" y="76.5" text-anchor="middle">R</text>
  </svg>`;
  const views = {
    primary: `<div class="primary serif">${gem}
      <div class="the"><span class="rule"></span><span>The</span><span class="rule"></span></div>
      <div class="ruvi" data-fit-ref>RUVI</div>
      <div class="collection sans" data-fit>Collection</div>
      ${q.get("tag") === "1" ? `<div class="tag">everyday jewelry</div>` : ""}</div>`,
    horizontal: `<div class="horizontal serif">${gem}<div class="words">
      <div class="line" data-fit-ref><span class="the">The</span><span class="ruvi">RUVI</span></div>
      <div class="collection sans" data-fit>Collection</div></div></div>`,
    monogram: ring,
    square: `<div class="square ${bg}">${ring}</div>`,
  };
  views.og = `<div class="square ${bg}">${views.primary}</div>`; // 1200x630 link-preview image
  document.body.className = "c-" + c;
  document.getElementById("root").outerHTML = views[v];

  // Space out "COLLECTION" so it lines up exactly with the line above it
  document.fonts.ready.then(() => {
    const ref = document.querySelector("[data-fit-ref]"), el = document.querySelector("[data-fit]");
    if (!ref || !el) return;
    const inner = (n) => { const r = document.createRange(); r.selectNodeContents(n); return r.getBoundingClientRect().width; };
    const trail = (n) => parseFloat(getComputedStyle(n.querySelector(".ruvi") || n).letterSpacing) || 0;
    const target = inner(ref) - trail(ref);
    const letters = el.textContent.length;
    const natural = inner(el);
    const ls = (target - natural) / (letters - 1);
    el.style.letterSpacing = ls + "px";
    el.style.marginRight = -ls + "px";
  });
</script>
</body>
</html>
