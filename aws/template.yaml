AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The Little LUXE - customer sign-in (Cognito), shop API (Lambda), orders/profiles (DynamoDB),
  product photos and product list (private S3 served through CloudFront).
  Deploy with aws/deploy.sh. Customer data (user pool, table, bucket) is kept if the stack is deleted.

Parameters:
  AuthDomainPrefix:
    Type: String
    Default: thelittleluxe-shop
    Description: Sign-in page address prefix (https://<prefix>.auth.<region>.amazoncognito.com)
  SiteOrigin:
    Type: String
    Default: https://srujanchary02.github.io
  SitePath:
    Type: String
    Default: /the-little-luxe/

Resources:
  # ---------- Customers & sign-in ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: tll-customers
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your The Little LUXE verification code
        EmailMessage: "Welcome to The Little LUXE! Your verification code is {####}"
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tll-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub "${SiteOrigin}${SitePath}"
        - !Sub "${SiteOrigin}${SitePath}admin.html"
        - http://localhost:8123/
        - http://localhost:8123/admin.html
      LogoutURLs:
        - !Sub "${SiteOrigin}${SitePath}"
        - !Sub "${SiteOrigin}${SitePath}admin.html"
        - http://localhost:8123/
        - http://localhost:8123/admin.html
      # ADMIN_USER_PASSWORD_AUTH needs AWS credentials (used only for automated tests), not usable from the web
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  OwnersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Shop owners - can manage products and orders
      UserPoolId: !Ref UserPool

  # ---------- Data ----------
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: tll-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # ---------- Photos & product list (private bucket, served only through CloudFront) ----------
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  MediaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "tll-media-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: The Little LUXE photos and product list
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt MediaOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: media
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 60669652-455b-4ae9-85a4-c4c02393f86c # Managed-SimpleCORS

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyCloudFrontCanReadPhotosAndCatalog
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource:
              - !Sub "${MediaBucket.Arn}/photos/*"
              - !Sub "${MediaBucket.Arn}/catalog/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCDN}"

  # ---------- Shop API ----------
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tll-api
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tll-api-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogs.Arn}"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: [!GetAtt DataTable.Arn, !Sub "${DataTable.Arn}/index/*"]
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: [!Sub "${MediaBucket.Arn}/catalog/*", !Sub "${MediaBucket.Arn}/photos/*"]
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tll-api
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogs
      # Placeholder - aws/deploy.sh uploads the real code (aws/api/index.mjs) right after the stack deploys
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: JSON.stringify({ error: "Deploying, try again in a minute." }) });
      Environment:
        Variables:
          TABLE: !Ref DataTable
          BUCKET: !Ref MediaBucket
          CDN_URL: !Sub "https://${MediaCDN.DomainName}"
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref WebClient

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE   # the function itself checks the Cognito sign-in on every request
      Cors:
        AllowOrigins: [!Ref SiteOrigin, "http://localhost:8123"]
        AllowMethods: ["*"]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  AuthDomain:
    Value: !Sub "https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ClientId:
    Value: !Ref WebClient
  ApiUrl:
    Value: !GetAtt ApiUrl.FunctionUrl
  CdnUrl:
    Value: !Sub "https://${MediaCDN.DomainName}"
  UserPoolId:
    Value: !Ref UserPool
  MediaBucket:
    Value: !Ref MediaBucket
